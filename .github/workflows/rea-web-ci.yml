name: Validate REA Web VI

on:
  push:
    branches: [rea-web-render]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm install --no-audit --no-fund
      - name: Validate source syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Check bundled REA package
        run: ./node_modules/.bin/rea --version
      - name: Build Render Docker image
        run: docker build --tag rea-web-vi:ci .
      - name: Test Docker container health
        shell: bash
        run: |
          set -euo pipefail
          C="$(docker run -d -p 10082:10000 -e PORT=10000 \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=ci-docker-password-is-not-a-production-secret \
            -e SESSION_SECRET=ci-docker-session-secret-is-not-a-production-secret \
            rea-web-vi:ci)"
          trap 'docker logs "$C" || true; docker rm -f "$C" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:10082/api/health > /tmp/docker-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/docker-health.json
          echo 'Docker container health passed'
      - name: Verify 56 MiB uploaded file can be analyzed
        shell: bash
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: 'test-password-for-actions-only-not-a-production-secret'
          SESSION_SECRET: 'test-session-secret-for-actions-only-not-a-production-secret'
          NODE_ENV: production
          PORT: '10083'
          DATA_DIR: '/tmp/rea-web-ci-large'
        run: |
          set -euo pipefail
          node server.mjs > /tmp/rea-web-large.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/rea-web-large.log' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:10083/api/health >/tmp/rea-health-large.json; then break; fi
            sleep 1
          done
          curl -fsS -c /tmp/rea-cookie-large -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"test-password-for-actions-only-not-a-production-secret"}' \
            http://localhost:10083/api/login >/tmp/rea-login-large.json
          curl -fsS -b /tmp/rea-cookie-large http://localhost:10083/api/capabilities >/tmp/rea-cap-large.json
          node -e "const c=require('/tmp/rea-cap-large.json');if(c.maxUploadMb!==75)process.exit(1)"
          python3 - <<'PY'
          import sqlite3, os
          p='/tmp/rea-ci-56mb.sqlite'
          conn=sqlite3.connect(p)
          conn.execute('CREATE TABLE large_payload (id INTEGER PRIMARY KEY, contents BLOB)')
          conn.execute('INSERT INTO large_payload(contents) VALUES(zeroblob(?))',(56*1024*1024,))
          conn.commit()
          conn.close()
          assert os.path.getsize(p)>55*1024*1024
          print('Generated large SQLite file',os.path.getsize(p),'bytes')
          PY
          HTTP_CODE="$(curl -sS -b /tmp/rea-cookie-large -o /tmp/rea-job-large.json -w '%{http_code}' \
            -F kind=sqlite -F file=@/tmp/rea-ci-56mb.sqlite \
            http://localhost:10083/api/jobs)"
          test "$HTTP_CODE" = 202 || { cat /tmp/rea-job-large.json; exit 1; }
          JOB_ID="$(node -p "require('/tmp/rea-job-large.json').job.id")"
          STATUS='queued'
          for i in $(seq 1 90); do
            curl -fsS -b /tmp/rea-cookie-large "http://localhost:10083/api/jobs/$JOB_ID" >/tmp/rea-status-large.json
            STATUS="$(node -p "require('/tmp/rea-status-large.json').job.status")"
            if [ "$STATUS" = completed ] || [ "$STATUS" = failed ]; then break; fi
            sleep 1
          done
          if [ "$STATUS" != completed ]; then cat /tmp/rea-status-large.json; exit 1; fi
          curl -fsS -b /tmp/rea-cookie-large \
            "http://localhost:10083/api/jobs/$JOB_ID/report" >/tmp/rea-report-large.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/rea-report-large.json','utf8'))"
          echo '56 MiB real SQLite upload and analysis PASS'
      - name: HTTP API smoke test
        shell: bash
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: 'test-password-for-actions-only-not-a-production-secret'
          SESSION_SECRET: 'test-session-secret-for-actions-only-not-a-production-secret'
          NODE_ENV: production
          PORT: '10081'
          DATA_DIR: '/tmp/rea-web-ci'
        run: |
          set -euo pipefail
          node server.mjs > /tmp/rea-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/rea-web.log' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:10081/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10081/api/jobs)" = "401"
          curl -fsS -c /tmp/rea-cookie -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"test-password-for-actions-only-not-a-production-secret"}' \
            http://localhost:10081/api/login >/tmp/login.json
          curl -fsS -b /tmp/rea-cookie http://localhost:10081/api/capabilities >/tmp/capabilities.json
          grep -q 'inspect-il2cpp-metadata' /tmp/capabilities.json
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('/tmp/rea-ci.sqlite')
          db.execute('CREATE TABLE evidence (id INTEGER PRIMARY KEY, name TEXT)')
          db.execute("INSERT INTO evidence (name) VALUES ('REA web test')")
          db.commit()
          db.close()
          PY
          curl -fsS -b /tmp/rea-cookie -F kind=sqlite -F file=@/tmp/rea-ci.sqlite \
            http://localhost:10081/api/jobs >/tmp/job.json
          node -e "const j=require('/tmp/job.json'); if(!j.job.id||j.job.status!=='queued')process.exit(1)"
          JOB_ID="$(node -p "require('/tmp/job.json').job.id")"
          for i in $(seq 1 60); do
            curl -fsS -b /tmp/rea-cookie "http://localhost:10081/api/jobs/$JOB_ID" >/tmp/job-detail.json
            STATUS="$(node -p "require('/tmp/job-detail.json').job.status")"
            if [ "$STATUS" = completed ] || [ "$STATUS" = failed ]; then break; fi
            sleep 1
          done
          if [ "$STATUS" != completed ]; then
            cat /tmp/job-detail.json
            exit 1
          fi
          curl -fsS -b /tmp/rea-cookie "http://localhost:10081/api/jobs/$JOB_ID/report" >/tmp/rea-result.json
          node -e "const fs=require('fs');let j=JSON.parse(fs.readFileSync('/tmp/rea-result.json','utf8'));if(!j)process.exit(1)"
          echo 'Real SQLite analysis completed and report downloaded'
