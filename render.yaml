services:
  - type: web
    name: rea-studio-vi
    runtime: docker
    region: singapore
    plan: free
    branch: rea-web-render
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "75"
      - key: REA_TIMEOUT_MS
        value: "180000"
    healthCheckPath: /api/health
